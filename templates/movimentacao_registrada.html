<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimentação registrada | CredMais</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/estilo_movimentacoes.css') }}">
    <link rel="icon" type="image/png" href="../static/uploads/LogoSoloCrediMais.png">
</head>
<body>

    <header class="cabecalho">
        <a href="{{ url_for('dashboard') }}" class="marca">
            <img
                src="{{ url_for('static', filename='uploads/logo.png') }}"
                alt="Logo CredMais"
                class="logo-imagem"
            >
        </a>

        <nav class="menu">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('perfil') }}">Perfil</a>
            <a href="#">Simulação</a>
            <a href="#">Empréstimos</a>
            <a href="{{ url_for('movimentacoes') }}" class="ativo">Movimentações</a>
        </nav>
    </header>

    <main class="pagina-sucesso">
        <section class="card-sucesso">
            <img
                src="{{ url_for('static', filename='uploads/icone-correto-movimentacao.png') }}"
                alt="Movimentação registrada"
                class="icone-sucesso"
            >

            <h1>Movimentação realizada com sucesso!</h1>
            <p class="subtitulo-sucesso">
                Sua movimentação foi registrada e alterada no seu perfil financeiro.
            </p>

            <div class="resumo-sucesso {{ dados.classe }}">
                <div>
                    <div class="resumo-rotulo">Valor da alteração</div>
                    <div class="resumo-valor-sucesso">R$ {{ dados.valor_texto }}</div>
                </div>

                <div class="resumo-info">
                    <div>Categoria: {{ dados.categoria }}</div>
                    <div>Descrição: {{ dados.descricao }}</div>
                </div>
            </div>

            <hr class="divisor-sucesso">

            <a href="{{ url_for('movimentacoes') }}" class="botao-voltar">Voltar para o Início</a>
        </section>
    </main>

</body>
</html>
